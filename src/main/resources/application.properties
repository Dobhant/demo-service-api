# =======================
# DATABASE
# =======================
spring.datasource.url=jdbc:postgresql://user_db:5432/userdb
spring.datasource.username=postgres
spring.datasource.password=123456

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =======================
# KAFKA PRODUCER
# =======================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Circuit Breaker config ---
resilience4j.circuitbreaker.instances.kafkaProducer.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaProducer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.kafkaProducer.permitted-number-of-calls-in-half-open-state=3

# --- Retry config ---
resilience4j.retry.instances.kafkaProducer.max-attempts=3
resilience4j.retry.instances.kafkaProducer.wait-duration=1s


# =======================
# SERVER
# =======================
server.port=8080
