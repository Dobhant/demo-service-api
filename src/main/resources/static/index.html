<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8">
    <title>User CRUD</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        input, button { margin: 5px; padding: 5px; }
        table, th, td { border: 1px solid gray; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>
<h2>📋 Users</h2>
<table id="usersTable">
    <thead>
    <th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Created At</th><th>Actions</th>
    </thead>
    <tbody></tbody>
</table>

<h3>➕ Add User</h3>
<input type="text" id="name" placeholder="Name">
<input type="email" id="email" placeholder="Email">
<input type="number" id="age" placeholder="Age">
<button onclick="createUser()">Add</button>

<script>
    const apiUrl = '/api/users';

    async function loadUsers() {
        const res = await fetch(apiUrl);
        const users = await res.json();
        const tbody = document.querySelector("#usersTable tbody");
        tbody.innerHTML = '';
        users.forEach(user => {
            tbody.innerHTML += `
          <tr>
            <td>${user.id}</td>
            <td><input value="${user.name}" onchange="editUser(${user.id}, 'name', this.value)"></td>
            <td><input value="${user.email}" onchange="editUser(${user.id}, 'email', this.value)"></td>
            <td><input type="number" value="${user.age}" onchange="editUser(${user.id}, 'age', this.value)"></td>
            <td>${new Date(user.createdAt).toLocaleString()}</td>
            <td><button onclick="deleteUser(${user.id})">Delete</button></td>
          </tr>`;
        });
    }

    async function createUser() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const age = document.getElementById("age").value;

        await fetch(apiUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, email, age: parseInt(age) })
        });
        loadUsers();
    }

    async function editUser(id, field, value) {
        const res = await fetch(`${apiUrl}/${id}`);
        const user = await res.json();
        user[field] = field === 'age' ? parseInt(value) : value;

        await fetch(`${apiUrl}/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user)
        });
        loadUsers();
    }

    async function deleteUser(id) {
        await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
        loadUsers();
    }

    loadUsers();
</script>
</body>
</html>
